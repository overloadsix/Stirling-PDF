name: Windows desktop installer
on:
  push:
    branches: [feature/adobe-legacy-release]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adobe-legacy-windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            frontend/src-tauri -> target
            frontend/src-tauri/provisioner -> target
            frontend/src-tauri/thumbnail-handler -> target
      - name: Check desktop source
        run: task frontend:typecheck:desktop
      - name: Build Windows desktop installer
        run: task desktop:build:dev:windows
      - name: Verify installer and write checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows desktop installer.' }
          $installer = $installers[0]
          if ($installer.Length -lt 10000000) { throw 'Installer is unexpectedly small.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $installer.DirectoryName 'SHA256SUMS.txt')
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Stirling-PDF-Windows-Desktop
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish desktop download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = '2bdfa19e8821cda40965d00288643ce3a57061d8'
          $baselineTag = 'v0.0.0-snapshot-baseline'
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$baselineTag" 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if ($existing.object.sha -ne $baseline) { throw 'Baseline tag differs; refusing to move it.' }
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$baselineTag" -f "sha=$baseline"
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the baseline tag.' }
          }
          $tag = "v3.2.1-adobe-legacy.$env:GITHUB_RUN_NUMBER"
          $notes = @'
          Windows desktop installer for the Stirling PDF fork with desktop selection behavior and a three-pane home interface.

          Includes the native Tauri application, PDF backend, and bundled Java runtime. This is a custom unsigned build.

          Click once to select a file or tool. Double-click to open it. The original source snapshot is preserved as v0.0.0-snapshot-baseline.
          '@
          $notes | Set-Content -Encoding utf8 release-notes.txt
          $installer = (Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          $checksums = (Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt).FullName
          gh release create $tag $installer $checksums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Stirling PDF Windows Desktop - Legacy Home' --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the Windows installer.' }
