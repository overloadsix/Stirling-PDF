name: Adobe legacy release
on:
  push:
    branches: [feature/adobe-legacy-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frontend
        run: task frontend:check
      - name: Build frontend
        run: task frontend:build:proprietary
      - name: Compile application
        run: ./gradlew build -PbuildWithFrontend=true -x test
      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stirling-pdf-adobe-legacy
          path: |
            build/libs/*.jar
            app/**/build/libs/*.jar
            frontend/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Verify Docker build
        run: docker build -t stirling-pdf:custom -f docker/embedded/Dockerfile .
